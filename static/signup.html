<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>注册 - Web 网盘</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar">
        <h1>Web 网盘</h1>
    </div>

    <div class="container">
        <div class="card">
            <h2>注册</h2>

            <form id="signupForm">
                <div class="form-row">
                    <label>用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-row">
                    <label>密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">注册</button>
            </form>

            <p class="msg" id="msg"></p>
            <p>已有账号？<a href="/static/login.html">去登录</a></p>
        </div>
    </div>

    <script src="/static/js/signup.js"></script>
</body>
</html>
