<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>登录 - Web 网盘</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar">
        <h1>Web 网盘</h1>
    </div>

    <div class="container">
        <div class="card">
            <h2>登录</h2>

            <form id="loginForm">
                <div class="form-row">
                    <label>用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-row">
                    <label>密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">登录</button>
            </form>

            <p class="msg" id="msg"></p>
            <p>没有账号？<a href="/static/signup.html">去注册</a></p>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
